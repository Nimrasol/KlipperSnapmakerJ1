# This file contains a configuration for the Snapmaker J1 IDEX printer
# (GD32F305 main controller).
#
# To use this config, the firmware should be compiled with these
# options in "make menuconfig" (Klipper with
# firmware/klipper-gd32f305-snapmaker.patch of KlipperSnapmakerJ1):
#   [*] Enable extra low-level configuration options
#   Micro-controller Architecture: STMicroelectronics STM32
#   Processor model: GigaDevice GD32F305
#   Bootloader offset: 10KiB bootloader
#   Clock Reference: 25 MHz crystal
#   Communication interface: Serial (on USART2 PD6/PD5)
#   Baud rate for serial port: 230400
#   GPIO pins to set at micro-controller startup:
#     PD4,PC10,!PA10,!PA9,!PC11,!PE14,!PE13
#   (display and motors on; bed relay, bed and hotend heater supplies and
#   hotend heaters off until Klipper configures them: unconfigured, the
#   bed relay input floats and switches the bed on)
#   [*] Support the Snapmaker J1 factory bootloader
#
# PD4 powers the display/host module and PC10 the stepper drivers, so
# both must be enabled before the host connects.  The firmware is
# packaged with scripts/snapmaker_j1_package.py and installed through
# the factory bootloader - see docs/Snapmaker_J1.md.
#
# The board exists in two revisions with different power loss and
# stall detection wiring; set hardware_version in [snapmaker_j1]
# accordingly (SNAPMAKER_QUERY_HARDWARE reports the detected revision).

# See docs/Config_Reference.md of Klipper for a description of
# parameters.

[mcu]
# UART2 of the display module (blsp_uart2): /dev/ttyMSM1 with the mainline
# kernel of KlipperSnapmakerJ1-os (/dev/ttyHSL1 with the stock Android
# kernel).
serial: /dev/ttyMSM1
baud: 230400
restart_method: command

# Limits of the stock firmware as stored on a J1 (M503: M203 X350 Y300
# Z10 E40, M201 X10000 Y8000 Z100 E6000); Klipper has one limit for X and
# Y, so the lower Y values apply.  The noise modes lower them further.
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 8000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PB10
dir_pin: PE15
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD13
position_endstop: -13
position_min: -13
position_max: 324
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 2

[dual_carriage]
axis: x
safe_distance: 24
step_pin: PC5
dir_pin: !PC4
enable_pin: !PB0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB2
# position_endstop and position_max (the X position of the right nozzle
# when homed) are in printer.cfg: SNAPMAKER_CALIBRATE_XY stores them with
# SAVE_CONFIG, which cannot change values of an included file
position_min: 0
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 2

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB9
position_endstop: 0
position_max: 202
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 2

# The bed moves on Z and homes downwards to the maximum position.  The
# endstop position defines the nozzle height and is calibrated with
# SNAPMAKER_CALIBRATE_Z (the XY calibration probes below the build
# plate surface, hence the negative minimum).
[stepper_z]
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE12
microsteps: 16
rotation_distance: 2
endstop_pin: ^PE7
# position_endstop and position_max are in printer.cfg (SAVE_CONFIG of
# SNAPMAKER_CALIBRATE_Z)
position_min: -8
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2

[extruder]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 23.091
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_only_velocity: 40
max_extrude_only_accel: 6000
heater_pin: PE14
sensor_type: snapmaker_j1_pt100
sensor_pin: PA3
# The ADC of the main controller measures against 3.3V (default: 5V)
adc_voltage: 3.3
# pid_Kp, pid_Ki and pid_Kd are in printer.cfg (PID_CALIBRATE stores them
# with SAVE_CONFIG, which cannot change values of an included file)
control: pid
# The stock firmware reports a sensor fault below 5C (HEATER_x_MINTEMP)
min_temp: 5
max_temp: 320
min_extrude_temp: 170
pressure_advance: 0.02

[extruder1]
step_pin: PC2
dir_pin: !PC1
enable_pin: !PC3
microsteps: 16
rotation_distance: 23.091
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_only_velocity: 40
max_extrude_only_accel: 6000
heater_pin: PE13
sensor_type: snapmaker_j1_pt100
sensor_pin: PA1
# The ADC of the main controller measures against 3.3V (default: 5V)
adc_voltage: 3.3
# pid_Kp, pid_Ki and pid_Kd are in printer.cfg (PID_CALIBRATE stores them
# with SAVE_CONFIG, which cannot change values of an included file)
control: pid
# The stock firmware reports a sensor fault below 5C (HEATER_x_MINTEMP)
min_temp: 5
max_temp: 320
min_extrude_temp: 170
pressure_advance: 0.02

# The toolheads use PT100 sensors with an amplifier
[adc_temperature snapmaker_j1_pt100]
temperature1: 0
voltage1: 0.5060
temperature2: 23
voltage2: 0.6397
temperature3: 51
voltage3: 0.7992
temperature4: 79
voltage4: 0.9563
temperature5: 100
voltage5: 1.0715
temperature6: 128
voltage6: 1.2238
temperature7: 150
voltage7: 1.3406
temperature8: 176
voltage8: 1.4776
temperature9: 199
voltage9: 1.5799
temperature10: 220
voltage10: 1.6830
temperature11: 240
voltage11: 1.7813
temperature12: 260
voltage12: 1.8796
temperature13: 280
voltage13: 1.9763
temperature14: 300
voltage14: 2.0673
temperature15: 310
voltage15: 2.1141
temperature16: 350
voltage16: 2.3010

# The heated bed is switched through a solid state relay (high = on, as
# the stock firmware drives it: HEATER_BED_INVERTING false)
[heater_bed]
heater_pin: PA10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
# pid_Kp, pid_Ki and pid_Kd are in printer.cfg (see [extruder])
control: pid
min_temp: 5
max_temp: 110

[verify_heater extruder]
max_error: 120
check_gain_time: 40
hysteresis: 4
heating_gain: 2

[verify_heater extruder1]
max_error: 120
check_gain_time: 40
hysteresis: 4
heating_gain: 2

[verify_heater heater_bed]
max_error: 120
check_gain_time: 900
hysteresis: 4
heating_gain: 2

# All six drivers share one UART behind an analog multiplexer
[tmc2209 stepper_x]
uart_pin: PD9
tx_pin: PD8
select_pins: !PB15, PD10, !PD11
uart_address: 3
run_current: 1.000
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[tmc2209 dual_carriage]
uart_pin: PD9
tx_pin: PD8
select_pins: !PB15, !PD10, PD11
uart_address: 3
run_current: 1.000
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD9
tx_pin: PD8
select_pins: PB15, !PD10, !PD11
uart_address: 3
run_current: 1.400
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PD9
tx_pin: PD8
select_pins: PB15, PD10, !PD11
uart_address: 3
run_current: 1.000
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PD9
tx_pin: PD8
select_pins: PB15, PD10, PD11
uart_address: 3
run_current: 0.800
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[tmc2209 extruder1]
uart_pin: PD9
tx_pin: PD8
select_pins: !PB15, PD10, PD11
uart_address: 3
run_current: 0.800
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

# With dual carriages the shaper is configured per carriage at startup
# (stock defaults: ei shaper at 50Hz with 0.1 damping on X and Y, see
# _SNAPMAKER_INIT and M593)
[input_shaper]

# Part cooling fans (selected per toolhead by M106/M107); the names are
# shown in KlipperScreen
[fan_generic left_part_fan]
pin: PC9

[fan_generic right_part_fan]
pin: PC7

[heater_fan left_hotend_fan]
pin: PA8
heater: extruder
heater_temp: 60

[heater_fan right_hotend_fan]
pin: PC8
heater: extruder1
heater_temp: 60

# Electronics cooling, controlled by the board temperature sensor; the
# leading underscore hides it in KlipperScreen, Mainsail and Fluidd (it
# runs by itself and needs no attention)
[temperature_fan _board_fan]
pin: PC6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
control: watermark
target_temp: 45
min_temp: 0
max_temp: 100
max_speed: 1.0

[output_pin case_light]
pin: PB8
pwm: True
value: 0.59
cycle_time: 0.010

# Power switches of the main board.  The heater supplies switch off
# whenever Klipper shuts down; the display/host supply never does.  The
# leading underscore hides them in KlipperScreen.
[output_pin _heater_power]
pin: PC11
value: 1
shutdown_value: 0

[output_pin _bed_power]
pin: PA9
value: 1
shutdown_value: 0

[output_pin _motor_power]
pin: PC10
value: 1
shutdown_value: 1

[output_pin _screen_power]
pin: PD4
value: 1
shutdown_value: 1

[snapmaker_j1]
hardware_version: 2
hw_version_pin: PB1
nozzle_id_pin_t0: PA5
nozzle_id_pin_t1: PA6
bed_feedback_pin: !PA12

# Each nozzle closes a contact switch when it touches something
[snapmaker_j1_probe]
pin_t0: ^!PA7
pin_t1: ^!PE8
power_pin: PD14
z_offset: 0
speed: 5
lift_speed: 10
samples: 3
sample_retract_dist: 1
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 2
# Stock calibration points: bed center (XY calibration feature), rear
# center, front left, front right, rear left, rear right
calibration_points:
    162, 101
    162, 187
    47, 7
    277, 7
    47, 187
    277, 187
xy_probe_z: -6.2
# Calibration touches as in the stock firmware: one fast touch (300
# mm/min), then five slow ones (a tenth of the speed); the switch
# opening point is measured
z_probe_speed: 5
z_probe_slow_speed: 0.5
z_live_speed: 1.25
xy_probe_speed: 13.333
xy_probe_slow_speed: 1.333
# StallGuard stops the fast touch when the axis is blocked before the
# nozzle switch closes.  Revision 2 boards have one DIAG line per
# driver; on revision 1 boards all drivers share PE3 (active low):
#   stallguard_pin_stepper_x: !PE3
#   stallguard_pin_dual_carriage: !PE3
#   stallguard_pin_stepper_y: !PE3
#   stallguard_pin_stepper_z: !PE3
# The thresholds (stock defaults X/Y 20, Z 80) are derived from the
# driver load during the first travel moves, as the stock firmware
# does; stallguard_threshold_<stepper> sets a fixed value instead.
stallguard_pin_stepper_x: PD12
stallguard_pin_dual_carriage: PE3
stallguard_pin_stepper_y: PB5
stallguard_pin_stepper_z: PE9

[snapmaker_j1_filament_sensor filament_sensor_t0]
adc_pin: PA4
extruder: extruder
pause_on_runout: False
runout_gcode:
    _SNAPMAKER_FILAMENT_RUNOUT EXTRUDER=extruder

[snapmaker_j1_filament_sensor filament_sensor_t1]
adc_pin: PA0
extruder: extruder1
pause_on_runout: False
runout_gcode:
    _SNAPMAKER_FILAMENT_RUNOUT EXTRUDER=extruder1

# Mains failure input (PD15 on revision 2 boards, PC12 on revision 1)
[snapmaker_j1_power_loss]
sense_pin: ^PD15
debounce_delay: 0.010
filename: ~/printer_data/config/snapmaker_j1_power_loss.json
save_objects: gcode_macro _SNAPMAKER_STATE, fan_generic left_part_fan,
    fan_generic right_part_fan
resume_gcode:
    {% set j1 = state.objects['gcode_macro _SNAPMAKER_STATE'] %}
    _SNAPMAKER_POWER_LOSS_RESTORE X={state.gcode_position[0]} Y={state.gcode_position[1]} Z={state.gcode_position[2]} E={state.gcode_position[3]} OFFSET_X={state.homing_origin[0]} OFFSET_Y={state.homing_origin[1]} OFFSET_Z={state.homing_origin[2]} EXTRUDER={state.extruder} BED={state.heaters.heater_bed} T0={state.heaters.extruder} T1={state.heaters.extruder1} SPEED={state.speed} SPEED_FACTOR={state.speed_factor} EXTRUDE_FACTOR={state.extrude_factor} ABS_E={1 if state.absolute_extrude else 0} MODE={j1.print_mode} SWAPPED={1 if j1.backup_swapped else 0} FAN0={state.objects['fan_generic left_part_fan'].speed} FAN1={state.objects['fan_generic right_part_fan'].speed}

# The three bed leveling knobs (rear center, front left, front right)
[screws_tilt_adjust]
screw1: 162, 187
screw1_name: rear center
screw2: 47, 7
screw2_name: front left
screw3: 277, 7
screw3_name: front right
horizontal_move_z: 5
speed: 150
screw_thread: CW-M4

[save_variables]
filename: ~/printer_data/config/snapmaker_j1_variables.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[exclude_object]

[gcode_arcs]

[respond]

[idle_timeout]
timeout: 1800

[include snapmaker-j1-macros.cfg]
