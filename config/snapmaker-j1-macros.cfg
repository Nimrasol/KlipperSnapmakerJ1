# Snapmaker J1 workflows and Snapmaker/Marlin g-code compatibility.
# Included by printer-snapmaker-j1-2022.cfg.
#
# The stock firmware behavior these macros reproduce is documented in
# docs/Snapmaker_J1.md.  Commands are named SNAPMAKER_*; helpers that
# are not meant to be called directly start with an underscore.

######################################################################
# Machine state
######################################################################

[gcode_macro _SNAPMAKER_STATE]
# FULL_CONTROL, DUPLICATION, MIRROR or BACKUP
variable_print_mode: 'FULL_CONTROL'
# In BACKUP mode, true once printing continued on the other toolhead
variable_backup_swapped: False
variable_duplication_offset: 162
variable_noise_mode: 'NORMAL'
variable_max_velocity: 200
variable_max_accel: 8000
variable_t1_offset_y: 0.0
# Highest heater targets of the stock firmware (MAXTEMP - OVERSHOOT); the
# heaters shut down at max_temp (320C, 110C)
variable_max_nozzle_target: 300
variable_max_bed_target: 100
variable_pause_position: [0, 0, 0]
# Part fan speeds (left, right) and heater targets (left, right, bed) of
# the print when it paused; RESUME restores them
variable_pause_fans: [0, 0]
variable_pause_temps: [0, 0, 0]
# True once the pause cooldown turned the nozzles off
variable_pause_cooled: False
# Toolhead waiting for new filament in a paused print (-1: none); the
# display shows the filament runout or change dialog for it
variable_runout_tool: -1
variable_runout_reason: ''
gcode:

[delayed_gcode _SNAPMAKER_INIT]
initial_duration: 1
gcode:
    {% set svv = printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=t1_offset_y VALUE={svv.snap_j1_t1_offset_y|default(0.0)}
    _SNAPMAKER_SET_SHAPER SHAPER_TYPE_X=ei SHAPER_FREQ_X={svv.snap_j1_shaper_freq_x|default(50)} DAMPING_RATIO_X=0.1 SHAPER_TYPE_Y=ei SHAPER_FREQ_Y={svv.snap_j1_shaper_freq_y|default(50)} DAMPING_RATIO_Y=0.1
    SNAPMAKER_NOISE_MODE MODE=NORMAL
    # The case light as last chosen on the screen ("Light" panel)
    {% if svv.snap_j1_case_light is defined %}
    SET_PIN PIN=case_light VALUE={svv.snap_j1_case_light}
    {% endif %}

[gcode_macro _SNAPMAKER_SET_SHAPER]
gcode:
    # Apply SET_INPUT_SHAPER parameters to both carriages
    {% set ns = namespace(args='') %}
    {% for key, value in params.items() %}
      {% set ns.args = ns.args ~ ' ' ~ key ~ '=' ~ value %}
    {% endfor %}
    {% if printer.dual_carriage.carriage_1 in ['COPY', 'MIRROR'] %}
    SET_INPUT_SHAPER{ns.args}
    {% else %}
      {% set active = 1 if printer.dual_carriage.carriage_1 == 'PRIMARY' else 0 %}
    SET_DUAL_CARRIAGE CARRIAGE={1 - active}
    SET_INPUT_SHAPER{ns.args}
    SET_DUAL_CARRIAGE CARRIAGE={active}
    SET_INPUT_SHAPER{ns.args}
    {% endif %}

######################################################################
# Homing (the bed homes away from the nozzle, so Z always goes first)
######################################################################

[homing_override]
axes: xyz
gcode:
    {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if all or 'Z' in params %}
    G28 Z
    {% endif %}
    {% if all or 'X' in params %}
    G28 X
    {% endif %}
    {% if all or 'Y' in params %}
    G28 Y
    {% endif %}
    {% if all or 'X' in params %}
    _SNAPMAKER_AFTER_X_HOMING
    {% endif %}

[gcode_macro _SNAPMAKER_AFTER_X_HOMING]
gcode:
    # X homing leaves the left carriage active - restore the active tool
    # and the IDEX mode of the current print
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    _SNAPMAKER_APPLY_MODE
    {% elif printer.toolhead.extruder == 'extruder1' %}
    SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}

######################################################################
# Tool changes and IDEX modes
######################################################################

[gcode_macro T0]
gcode:
    _SNAPMAKER_SELECT_TOOL TOOL=0

[gcode_macro T1]
gcode:
    _SNAPMAKER_SELECT_TOOL TOOL=1

[gcode_macro _SNAPMAKER_SELECT_TOOL]
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set tool = params.TOOL|int %}
    {% if s.backup_swapped %}
      {% set tool = 1 - tool %}
    {% endif %}
    {% set extruder = 'extruder' if tool == 0 else 'extruder1' %}
    {% if s.print_mode in ['DUPLICATION', 'MIRROR'] %}
      # Both toolheads print together - tool changes have no effect
    {% elif printer.toolhead.extruder != extruder %}
      {% if 'xyz' in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=_snap_j1_toolchange
        G91
        {% if printer.toolhead.position.z + 2 <= printer.toolhead.axis_maximum.z %}
        G1 Z2 F600
        {% endif %}
        _SNAPMAKER_PARK_CARRIAGE
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
        SET_DUAL_CARRIAGE CARRIAGE={tool}
        RESTORE_GCODE_STATE NAME=_snap_j1_toolchange MOVE=0
      {% else %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
        SET_DUAL_CARRIAGE CARRIAGE={tool}
      {% endif %}
      SET_GCODE_OFFSET Y={s.t1_offset_y if tool == 1 else 0}
    {% endif %}

[gcode_macro _SNAPMAKER_PARK_CARRIAGE]
gcode:
    # Move the active carriage to its endstop (its parking position)
    {% set carriage = 1 if printer.toolhead.extruder == 'extruder1' else 0 %}
    {% set park_x = printer.snapmaker_j1_probe.carriage_endstops[1]
                    if carriage == 1
                    else printer.snapmaker_j1_probe.carriage_endstops[0] %}
    SAVE_GCODE_STATE NAME=_snap_j1_park
    SET_GCODE_OFFSET X=0 Y=0
    G90
    G1 X{park_x} F9000
    RESTORE_GCODE_STATE NAME=_snap_j1_park

[gcode_macro M605]
description: Select the IDEX mode (S0/S1 full control, S2 duplication, S3 mirror, S4 backup)
gcode:
    {% set modes = ['FULL_CONTROL', 'FULL_CONTROL', 'DUPLICATION', 'MIRROR', 'BACKUP'] %}
    {% set mode = params.S|default(1)|int %}
    {% if mode < 0 or mode > 4 %}
      { action_raise_error("M605: unsupported mode %d" % mode) }
    {% endif %}
    {% if mode == 2 and params.X is defined %}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=duplication_offset VALUE={params.X|float}
    {% endif %}
    SNAPMAKER_SET_PRINT_MODE MODE={modes[mode]}

[gcode_macro SNAPMAKER_SET_PRINT_MODE]
description: Select the IDEX print mode (FULL_CONTROL, DUPLICATION, MIRROR, BACKUP)
gcode:
    {% set mode = params.MODE|default('FULL_CONTROL')|upper %}
    {% if mode not in ['FULL_CONTROL', 'DUPLICATION', 'MIRROR', 'BACKUP'] %}
      { action_raise_error("Unknown print mode %s" % mode) }
    {% endif %}
    _SNAPMAKER_RESET_MODE
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=print_mode VALUE='"{mode}"'
    {% if mode in ['DUPLICATION', 'MIRROR'] and 'x' in printer.toolhead.homed_axes %}
    _SNAPMAKER_APPLY_MODE
    {% endif %}

[gcode_macro _SNAPMAKER_APPLY_MODE]
gcode:
    # Arrange both carriages and couple the right one to the left one
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set x0 = printer.snapmaker_j1_probe.carriage_endstops[0] %}
    {% set x1 = printer.snapmaker_j1_probe.carriage_endstops[1] %}
    SAVE_GCODE_STATE NAME=_snap_j1_mode
    SET_GCODE_OFFSET X=0 Y=0
    G90
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{x0} F9000
    SET_DUAL_CARRIAGE CARRIAGE=1
    {% if s.print_mode == 'DUPLICATION' %}
    G1 X{x0 + s.duplication_offset} F9000
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    {% else %}
    G1 X{x1} F9000
    SET_DUAL_CARRIAGE CARRIAGE=0
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    {% endif %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESTORE_GCODE_STATE NAME=_snap_j1_mode
    SET_GCODE_OFFSET Y=0

[gcode_macro _SNAPMAKER_PRINT_DONE]
description: End of a completed print (called by snapmaker_j1)
gcode:
    # As the stock firmware at the end of a print: heaters and fans off,
    # full control mode, both carriages at their endstops, normal noise mode
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set dual = s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=left_part_fan SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0
    _SNAPMAKER_RESET_MODE
    SET_GCODE_OFFSET X=0 Y=0
    M220 S100
    M221 S100
    SNAPMAKER_NOISE_MODE MODE=NORMAL
    {% if dual %}
    # The end G-code homed with the right carriage still coupled, which
    # brought it back to its print position
    G28 X
    M84
    {% endif %}

[gcode_macro _SNAPMAKER_RESET_MODE]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    {% if printer.dual_carriage.carriage_1 in ['COPY', 'MIRROR'] %}
    SET_DUAL_CARRIAGE CARRIAGE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=print_mode VALUE='"FULL_CONTROL"'
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=backup_swapped VALUE=False

######################################################################
# Heaters and fans (tool aware, duplicated in COPY/MIRROR modes)
######################################################################

[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set temp = [params.S|default(0)|float, s.max_nozzle_target]|min %}
    {% set both = s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    {% if params.T is defined and not (both and params.T|int == 0) %}
      {% set tool = params.T|int %}
      {% set tool = 1 - tool if s.backup_swapped else tool %}
      M104.1 T{tool} S{temp}
    {% elif both %}
      # As the stock firmware: T0 (or no tool) sets both nozzles, slicers
      # only know T0 in these modes
      M104.1 T0 S{temp}
      M104.1 T1 S{temp}
    {% else %}
      M104.1 S{temp}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set temp = [params.S|default(params.R|default(0))|float, s.max_nozzle_target]|min %}
    {% set both = s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    {% if params.T is defined and not (both and params.T|int == 0) %}
      {% set tool = params.T|int %}
      {% set tool = 1 - tool if s.backup_swapped else tool %}
      M109.1 T{tool} S{temp}
    {% elif both %}
      M104.1 T1 S{temp}
      M109.1 T0 S{temp}
      M109.1 T1 S{temp}
    {% else %}
      M109.1 S{temp}
    {% endif %}

[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    M140.1 S{[params.S|default(0)|float, s.max_bed_target]|min}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    M190.1 S{[params.S|default(params.R|default(0))|float, s.max_bed_target]|min}

# The screen, Mainsail and Fluidd set targets with this command
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SNAPMAKER_BASE_SET_HEATER_TEMPERATURE
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set heater = params.HEATER %}
    {% set target = params.TARGET|default(0)|float %}
    {% if heater in ['extruder', 'extruder1'] %}
      {% set target = [target, s.max_nozzle_target]|min %}
    {% elif heater == 'heater_bed' %}
      {% set target = [target, s.max_bed_target]|min %}
    {% endif %}
    _SNAPMAKER_BASE_SET_HEATER_TEMPERATURE HEATER="{heater}" TARGET={target}

[gcode_macro M106]
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set speed = [params.S|default(255)|float / 255, 1.0]|min %}
    {% set fans = ['left_part_fan', 'right_part_fan'] %}
    {% if params.P is defined %}
      {% set fan = [params.P|int, 1]|min %}
      {% set fan = 1 - fan if s.backup_swapped else fan %}
      SET_FAN_SPEED FAN={fans[fan]} SPEED={speed}
    {% elif s.print_mode in ['DUPLICATION', 'MIRROR'] %}
      SET_FAN_SPEED FAN=left_part_fan SPEED={speed}
      SET_FAN_SPEED FAN=right_part_fan SPEED={speed}
    {% else %}
      SET_FAN_SPEED FAN={fans[1 if printer.toolhead.extruder == 'extruder1' else 0]} SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    {% if params.P is defined %}
    M106 P{params.P} S0
    {% else %}
    M106 S0
    {% endif %}

######################################################################
# Snapmaker / Marlin g-code compatibility
######################################################################

[gcode_macro M201]
description: Set the maximum acceleration (limited by the noise mode)
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set accel = [params.X|default(s.max_accel)|float,
                    params.Y|default(s.max_accel)|float, s.max_accel]|min %}
    SET_VELOCITY_LIMIT ACCEL={accel}

[gcode_macro M203]
description: Set the maximum velocity (limited by the noise mode)
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set velocity = [params.X|default(s.max_velocity)|float,
                       params.Y|default(s.max_velocity)|float,
                       s.max_velocity]|min %}
    SET_VELOCITY_LIMIT VELOCITY={velocity}

[gcode_macro M204]
rename_existing: M204.1
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if params.S is defined %}
    M204.1 S{[params.S|float, s.max_accel]|min}
    {% else %}
    M204.1 P{[params.P|default(s.max_accel)|float, s.max_accel]|min} T{[params.T|default(s.max_accel)|float, s.max_accel]|min}
    {% endif %}

[gcode_macro M205]
description: Set the junction speed (Snapmaker V parameter)
gcode:
    {% if params.V is defined %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.V|float}
    {% endif %}

[gcode_macro M593]
description: Set the input shaper (Snapmaker P type, F frequency, D damping)
gcode:
    {% set types = ['', 'ei', '2hump_ei', '3hump_ei', 'mzv', 'zv', 'zvd', 'zvd', 'zvd'] %}
    {% set both = params.X is not defined and params.Y is not defined %}
    {% set type = params.P|default(1)|int %}
    {% set freq = params.F|default(50)|float %}
    {% set damping = params.D|default(0.1)|float %}
    {% if type == 0 %}
      {% set freq = 0 %}
      {% set type = 1 %}
    {% endif %}
    {% if both or params.X is defined %}
    _SNAPMAKER_SET_SHAPER SHAPER_TYPE_X={types[type]} SHAPER_FREQ_X={freq} DAMPING_RATIO_X={damping}
    {% endif %}
    {% if both or params.Y is defined %}
    _SNAPMAKER_SET_SHAPER SHAPER_TYPE_Y={types[type]} SHAPER_FREQ_Y={freq} DAMPING_RATIO_Y={damping}
    {% endif %}

[gcode_macro M900]
description: Set the linear advance factor (pressure advance)
gcode:
    {% set extruder = 'extruder1' if params.T|default(0)|int == 1 else 'extruder' %}
    {% if params.K is defined %}
    SET_PRESSURE_ADVANCE EXTRUDER={extruder} ADVANCE={params.K|float}
    {% endif %}

[gcode_macro M906]
description: Set the stepper driver current in mA (I1 selects X2)
gcode:
    {% if params.X is defined %}
    SET_TMC_CURRENT STEPPER={'dual_carriage' if params.I|default(0)|int == 1 else 'stepper_x'} CURRENT={params.X|float / 1000}
    {% endif %}
    {% if params.Y is defined %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={params.Y|float / 1000}
    {% endif %}
    {% if params.Z is defined %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={params.Z|float / 1000}
    {% endif %}
    {% if params.E is defined %}
    SET_TMC_CURRENT STEPPER={'extruder1' if params.T|default(0)|int == 1 else 'extruder'} CURRENT={params.E|float / 1000}
    {% endif %}

[gcode_macro M355]
description: Set the case light (S on/off, P brightness 0-255)
gcode:
    {% set brightness = params.P|default(150)|float / 255 %}
    SET_PIN PIN=case_light VALUE={brightness if params.S|default(1)|int else 0}

[gcode_macro M600]
description: Pause for a filament change
gcode:
    {% if not printer.pause_resume.is_paused %}
    _SNAPMAKER_FILAMENT_WAIT TOOL={params.T|default(1 if printer.toolhead.extruder == 'extruder1' else 0)|int} REASON=change
    PAUSE
    {% endif %}

[gcode_macro _SNAPMAKER_FILAMENT_WAIT]
gcode:
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=runout_tool VALUE={params.TOOL|default(-1)|int}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=runout_reason VALUE='"{params.REASON|default('')}"'

[gcode_macro M1999]
description: Restart the main controller
gcode:
    {% if params.S is defined %}
    { action_respond_info("M1999 S: the display powers the Klipper host and is not restarted") }
    {% else %}
    FIRMWARE_RESTART
    {% endif %}

[gcode_macro M2000]
description: Snapmaker machine commands (S111 plate thickness, S113 noise mode)
gcode:
    {% set cmd = params.S|default(0)|int %}
    {% if cmd == 111 %}
    SNAPMAKER_SET_PLATE_THICKNESS THICKNESS={params.B|default(5.0)|float}
    {% elif cmd == 113 %}
    SNAPMAKER_NOISE_MODE MODE={['NORMAL', 'NORMAL', 'SILENT', 'LOUD'][[params.M|default(1)|int, 3]|min]}
    {% elif cmd == 200 %}
      # Quick parking of the inactive toolhead - the tool change macros
      # always park the inactive carriage
    {% elif cmd == 6 %}
    SET_PIN PIN=_heater_power VALUE=1
    SET_PIN PIN=_bed_power VALUE=1
    {% elif cmd == 7 %}
    SET_PIN PIN=_heater_power VALUE=0
    SET_PIN PIN=_bed_power VALUE=0
    {% endif %}

[gcode_macro G1029]
description: Stock firmware calibration (replaced by the SNAPMAKER_* commands)
gcode:
    { action_respond_info("G1029 is not supported - use SNAPMAKER_CALIBRATE_Z, SNAPMAKER_CALIBRATE_XY, SNAPMAKER_BED_LEVEL and SNAPMAKER_CALIBRATE_NOZZLE_HEIGHT") }

######################################################################
# Print start, pause, resume and cancel
######################################################################

[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _SNAPMAKER_BASE_SDCARD_PRINT_FILE
gcode:
    # Stock: ask before printing a file made for other nozzle diameters;
    # NOZZLE_CHECK=0 prints without asking
    {% if params.NOZZLE_CHECK|default(1)|int %}
    SNAPMAKER_CHECK_NOZZLES FILENAME="{params.FILENAME}"
    _SNAPMAKER_PRINT_FILE_CHECKED FILENAME="{params.FILENAME}"
    {% else %}
    _SNAPMAKER_PRINT_FILE FILENAME="{params.FILENAME}"
    {% endif %}

[gcode_macro _SNAPMAKER_PRINT_FILE_CHECKED]
gcode:
    {% set check = printer.snapmaker_j1.nozzle_check %}
    {% if not check.mismatch %}
    _SNAPMAKER_PRINT_FILE FILENAME="{params.FILENAME}"
    {% else %}
    {% set names = [] %}
    {% for d in check.file + check.machine %}
    {% set _ = names.append('?' if d is none else '%.1f mm' % d) %}
    {% endfor %}
    # The display shows the dialog (action:prompt, also in Mainsail and
    # Fluidd); the print starts when the user continues
    RESPOND TYPE=command MSG="action:prompt_begin Inconsistent Nozzle Diameter"
    RESPOND TYPE=command MSG="action:prompt_text The nozzle diameter defined by the G-code file is inconsistent with that of the machine, which may cause problems. Would you like to continue? File: Nozzle L {names[0]}, Nozzle R {names[1]} - Machine: Nozzle L {names[2]}, Nozzle R {names[3]}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_SNAPMAKER_NOZZLE_CANCEL"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue Anyway|_SNAPMAKER_NOZZLE_CONTINUE|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _SNAPMAKER_NOZZLE_CONTINUE]
gcode:
    {% set filename = printer.snapmaker_j1.nozzle_check.filename %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if filename %}
    SDCARD_PRINT_FILE FILENAME="{filename}" NOZZLE_CHECK=0
    {% endif %}

[gcode_macro _SNAPMAKER_NOZZLE_CANCEL]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Print canceled: nozzle diameter mismatch"

[gcode_macro _SNAPMAKER_PRINT_FILE]
gcode:
    # A print always starts in full control mode with normal noise
    # settings; the file header may request another IDEX mode
    _SNAPMAKER_RESET_MODE
    _SNAPMAKER_FILAMENT_WAIT
    SNAPMAKER_NOISE_MODE MODE=NORMAL
    SNAPMAKER_FILE_MODE FILENAME="{params.FILENAME}"
    _SNAPMAKER_BASE_SDCARD_PRINT_FILE FILENAME="{params.FILENAME}"

[gcode_macro PAUSE]
rename_existing: _SNAPMAKER_BASE_PAUSE
gcode:
    {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_position VALUE="{printer.gcode_move.position[:3]|list}"
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_fans VALUE="{[printer['fan_generic left_part_fan'].speed, printer['fan_generic right_part_fan'].speed]}"
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_temps VALUE="{[printer.extruder.target, printer.extruder1.target, printer.heater_bed.target]}"
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_cooled VALUE=False
    _SNAPMAKER_BASE_PAUSE
    SET_FAN_SPEED FAN=left_part_fan SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0
    SAVE_DUAL_CARRIAGE_STATE NAME=_snap_j1_pause
    _SNAPMAKER_PARK
    _SNAPMAKER_PAUSE_TIMER
    {% endif %}

[gcode_macro _SNAPMAKER_PAUSE_TIMER]
gcode:
    # (Re)start the pause cooldown (SNAPMAKER_SET_PAUSE_STANDBY DELAY=)
    {% set svv = printer.save_variables.variables %}
    UPDATE_DELAYED_GCODE ID=_SNAPMAKER_PAUSE_COOLDOWN DURATION={svv.snap_j1_pause_delay|default(10)|int * 60}

[delayed_gcode _SNAPMAKER_PAUSE_COOLDOWN]
gcode:
    # A print paused for a while: nozzles off (their fans stop once they
    # are cool), the bed at its standby temperature so the print stays on
    # the plate
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% if printer.pause_resume.is_paused %}
    {% set bed = [svv.snap_j1_pause_bed_temp|default(50)|float, s.pause_temps[2]]|min %}
    M118 Paused for a while: nozzles off, bed at {bed|int}C until the print is heated again
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_cooled VALUE=True
    {% endif %}

[gcode_macro SNAPMAKER_PAUSE_HEAT]
description: Heat a paused print again to its print temperatures
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if printer.pause_resume.is_paused %}
    {% set t = s.pause_temps %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t[0]}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t[1]}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={t[2]}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=pause_cooled VALUE=False
    _SNAPMAKER_PAUSE_TIMER
    {% if params.WAIT|default(0)|int and t[2] > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={t[2] - 2}
    {% endif %}
    {% endif %}

[gcode_macro SNAPMAKER_SET_PAUSE_STANDBY]
description: Bed standby temperature and cooldown delay of a paused print (BED= DELAY=minutes)
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% if params.BED is defined %}
      {% set bed = params.BED|float %}
      {% if bed < 0 or bed > s.max_bed_target %}
        { action_raise_error("BED must be between 0 and %d" % s.max_bed_target) }
      {% endif %}
      SAVE_VARIABLE VARIABLE=snap_j1_pause_bed_temp VALUE={bed|int}
      {% if printer.pause_resume.is_paused and s.pause_cooled %}
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={[bed, s.pause_temps[2]]|min}
      {% endif %}
    {% endif %}
    {% if params.DELAY is defined %}
      {% set delay = params.DELAY|int %}
      {% if delay < 1 or delay > 120 %}
        { action_raise_error("DELAY must be between 1 and 120 minutes") }
      {% endif %}
      SAVE_VARIABLE VARIABLE=snap_j1_pause_delay VALUE={delay}
    {% endif %}
    { action_respond_info("Paused print: nozzles off and bed at %dC after %d minutes" % (params.BED|default(svv.snap_j1_pause_bed_temp|default(50))|int, params.DELAY|default(svv.snap_j1_pause_delay|default(10))|int)) }

[gcode_macro _SNAPMAKER_PARK]
gcode:
    # Retract, lower the bed, park both carriages and the bed front
    {% set extruder = printer.toolhead.extruder %}
    {% set z = printer.toolhead.position.z %}
    SET_GCODE_OFFSET X=0 Y=0
    G91
    {% if printer[extruder].can_extrude %}
    G1 E-1 F200
    {% endif %}
    G1 Z{[2, printer.toolhead.axis_maximum.z - z]|min} F600
    G90
    _SNAPMAKER_PARK_BOTH
    G1 Y{printer.toolhead.axis_minimum.y} F9000

[gcode_macro _SNAPMAKER_PARK_BOTH]
gcode:
    {% set x0 = printer.snapmaker_j1_probe.carriage_endstops[0] %}
    {% set x1 = printer.snapmaker_j1_probe.carriage_endstops[1] %}
    {% set active = 1 if printer.toolhead.extruder == 'extruder1' else 0 %}
    {% set speed = params.SPEED|default(9000)|float %}
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{x0} F{speed}
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{x1} F{speed}
    SET_DUAL_CARRIAGE CARRIAGE={active}

[gcode_macro RESUME]
rename_existing: _SNAPMAKER_BASE_RESUME
gcode:
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if printer.pause_resume.is_paused %}
    # Print temperatures again (the pause cooldown may have lowered them)
    SNAPMAKER_PAUSE_HEAT WAIT=1
    _SNAPMAKER_PRIME_ACTIVE
    M400
    _SNAPMAKER_CHECK_FILAMENT
    _SNAPMAKER_FILAMENT_WAIT
    UPDATE_DELAYED_GCODE ID=_SNAPMAKER_PAUSE_COOLDOWN DURATION=0
    RESTORE_DUAL_CARRIAGE_STATE NAME=_snap_j1_pause MOVE=1
    G90
    G1 Y{s.pause_position[1]} F9000
    SET_FAN_SPEED FAN=left_part_fan SPEED={s.pause_fans[0]}
    SET_FAN_SPEED FAN=right_part_fan SPEED={s.pause_fans[1]}
    _SNAPMAKER_BASE_RESUME
    {% endif %}

[gcode_macro _SNAPMAKER_PRIME_ACTIVE]
gcode:
    # Heat and prime every toolhead used by the print at its parking
    # position, wiping the nozzle on the parking brush afterwards
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    _SNAPMAKER_PRIME_BOTH
    {% else %}
    _SNAPMAKER_PRIME TOOL={1 if printer.toolhead.extruder == 'extruder1' else 0}
    {% endif %}

[gcode_macro _SNAPMAKER_PRIME_BOTH]
gcode:
    # Duplication and mirror mode: as the stock firmware, both toolheads
    # prime together beside their wipers (the purge positions of
    # _SNAPMAKER_FILAMENT_MOVE, which differ per carriage, so each one
    # moves on its own) and wipe on them; the right extruder follows the
    # left one
    {% set t0 = [printer.extruder.target, 190]|max %}
    {% set t1 = [printer.extruder1.target, 190]|max %}
    SAVE_GCODE_STATE NAME=_snap_j1_prime
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t0}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t0 - 2}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1 - 2}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_GCODE_OFFSET X=0 Y=0
    G90
    M83
    _SNAPMAKER_PURGE_BOTH
    G1 E30 F200
    _SNAPMAKER_PARK_BOTH SPEED=900
    G4 P1000
    _SNAPMAKER_PURGE_BOTH
    G4 P1000
    _SNAPMAKER_PARK_BOTH SPEED=900
    SET_DUAL_CARRIAGE CARRIAGE=0
    RESTORE_GCODE_STATE NAME=_snap_j1_prime

[gcode_macro _SNAPMAKER_PURGE_BOTH]
gcode:
    # Both carriages at their purge positions, the left one active
    {% set ends = printer.snapmaker_j1_probe.carriage_endstops %}
    {% set offset = printer["gcode_macro _SNAPMAKER_FILAMENT_MOVE"].offset %}
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{ends[1] - offset[1]} F9000
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{ends[0] + offset[0]} F9000

[gcode_macro _SNAPMAKER_PRIME]
gcode:
    {% set tool = params.TOOL|int %}
    {% set extruder = 'extruder1' if tool == 1 else 'extruder' %}
    {% set home = printer.snapmaker_j1_probe.carriage_endstops[tool] %}
    # Prime beside the wiper (purge position), then wipe on it
    {% set offset = printer["gcode_macro _SNAPMAKER_FILAMENT_MOVE"].offset[tool] %}
    {% set out = -offset if tool == 1 else offset %}
    {% set target = [printer[extruder].target, 190]|max %}
    SAVE_GCODE_STATE NAME=_snap_j1_prime
    {% if printer[extruder].target < target %}
    SET_HEATER_TEMPERATURE HEATER={extruder} TARGET={target}
    {% endif %}
    TEMPERATURE_WAIT SENSOR={extruder} MINIMUM={target - 2}
    ACTIVATE_EXTRUDER EXTRUDER={extruder}
    {% if printer.dual_carriage['carriage_%d' % tool] != 'PRIMARY' %}
    SET_DUAL_CARRIAGE CARRIAGE={tool}
    {% endif %}
    G90
    M83
    G1 X{home + out} F9000
    G1 E30 F200
    G1 X{home} F900
    G4 P1000
    G1 X{home + out} F9000
    G4 P1000
    G1 X{home} F900
    RESTORE_GCODE_STATE NAME=_snap_j1_prime

[gcode_macro CANCEL_PRINT]
rename_existing: _SNAPMAKER_BASE_CANCEL_PRINT
gcode:
    UPDATE_DELAYED_GCODE ID=_SNAPMAKER_PAUSE_COOLDOWN DURATION=0
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=left_part_fan SPEED=0
    SET_FAN_SPEED FAN=right_part_fan SPEED=0
    {% if printer[printer.toolhead.extruder].can_extrude %}
    G91
    G1 E-1 F200
    G90
    {% endif %}
    _SNAPMAKER_BASE_CANCEL_PRINT
    _SNAPMAKER_FILAMENT_WAIT
    _SNAPMAKER_RESET_MODE
    M220 S100
    M221 S100
    SET_GCODE_OFFSET X=0 Y=0
    G28
    SNAPMAKER_NOISE_MODE MODE=NORMAL

######################################################################
# Filament
######################################################################

[gcode_macro _SNAPMAKER_FILAMENT_RUNOUT]
gcode:
    # A sensor of an unused toolhead is ignored; in BACKUP mode printing
    # continues on the other toolhead, otherwise the print pauses
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set extruder = params.EXTRUDER %}
    {% if printer.print_stats.state == 'printing' %}
      {% if s.print_mode in ['DUPLICATION', 'MIRROR'] or extruder == printer.toolhead.extruder %}
        {% if s.print_mode == 'BACKUP' and not s.backup_swapped %}
        _SNAPMAKER_BACKUP_SWITCH
        {% else %}
        M118 Filament runout or jam on {extruder}
        _SNAPMAKER_FILAMENT_WAIT TOOL={1 if extruder == 'extruder1' else 0} REASON=runout
        PAUSE
        {% endif %}
      {% endif %}
    {% endif %}

[gcode_macro _SNAPMAKER_BACKUP_SWITCH]
gcode:
    {% set old = printer.toolhead.extruder %}
    {% set new = 'extruder1' if old == 'extruder' else 'extruder' %}
    {% set new_tool = 1 if new == 'extruder1' else 0 %}
    {% set fans = ['left_part_fan', 'right_part_fan'] %}
    {% set fan = printer['fan_generic ' ~ fans[1 - new_tool]].speed %}
    M118 Filament runout on {old}, continuing with {new}
    SET_HEATER_TEMPERATURE HEATER={new} TARGET={printer[old].target}
    SAVE_GCODE_STATE NAME=_snap_j1_backup
    _SNAPMAKER_PARK
    RESTORE_GCODE_STATE NAME=_snap_j1_backup MOVE=0
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=backup_swapped VALUE=True
    _SNAPMAKER_PRIME TOOL={new_tool}
    SET_HEATER_TEMPERATURE HEATER={old} TARGET=0
    SET_FAN_SPEED FAN={fans[1 - new_tool]} SPEED=0
    SET_FAN_SPEED FAN={fans[new_tool]} SPEED={fan}
    SET_GCODE_OFFSET Y={printer["gcode_macro _SNAPMAKER_STATE"].t1_offset_y if new_tool == 1 else 0}

[gcode_macro _SNAPMAKER_CHECK_FILAMENT]
gcode:
    # After priming: the stock firmware does not continue a print when
    # the sensor of a printing toolhead saw no filament motion
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% if s.print_mode in ['DUPLICATION', 'MIRROR'] %}
      {% set tools = [0, 1] %}
    {% else %}
      {% set tools = [1 if printer.toolhead.extruder == 'extruder1' else 0] %}
    {% endif %}
    {% for tool in tools %}
      {% set sensor = printer['snapmaker_j1_filament_sensor filament_sensor_t%d' % tool] %}
      {% if sensor.enabled and not sensor.filament_detected %}
        { action_raise_error("No filament motion on the %s toolhead - load filament and resume again" % ('left', 'right')[tool]) }
      {% endif %}
    {% endfor %}

[gcode_macro M412]
description: Filament sensor on/off as in the stock firmware (S0|S1 T0|T1)
gcode:
    {% if params.S is defined %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_t{[params.T|default(0)|int, 1]|min} ENABLE={1 if params.S|int else 0}
    {% endif %}
    {% if params.D is defined %}
    { action_respond_info("M412 D: the check distance is set by check_distance in the configuration") }
    {% endif %}
    _SNAPMAKER_M412_REPORT

[gcode_macro _SNAPMAKER_M412_REPORT]
gcode:
    {% set t0 = printer['snapmaker_j1_filament_sensor filament_sensor_t0'] %}
    {% set t1 = printer['snapmaker_j1_filament_sensor filament_sensor_t1'] %}
    { action_respond_info("filament check enable T[0]:%d, T[1]:%d" % (t0.enabled, t1.enabled)) }

[gcode_macro SNAPMAKER_LOAD_FILAMENT]
description: Heat a toolhead and load filament (TOOL=0|1 TEMP= LENGTH= SPEED=)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set temp = params.TEMP|default(220)|float %}
    _SNAPMAKER_FILAMENT_POSITION TOOL={tool}
    M109.1 T{tool} S{temp}
    _SNAPMAKER_EXTRUDE TOOL={tool} LENGTH={params.LENGTH|default(60)|float} SPEED={params.SPEED|default(600)|float}
    {% if printer.pause_resume.is_paused %}
    _SNAPMAKER_PAUSE_TIMER
    {% endif %}

[gcode_macro SNAPMAKER_UNLOAD_FILAMENT]
description: Heat a toolhead and unload filament (TOOL=0|1 TEMP= LENGTH=)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set temp = params.TEMP|default(220)|float %}
    _SNAPMAKER_FILAMENT_POSITION TOOL={tool}
    M109.1 T{tool} S{temp}
    _SNAPMAKER_EXTRUDE TOOL={tool} LENGTH=5 SPEED=300
    _SNAPMAKER_EXTRUDE TOOL={tool} LENGTH=-{params.LENGTH|default(80)|float} SPEED=1800
    {% if printer.pause_resume.is_paused %}
    _SNAPMAKER_PAUSE_TIMER
    {% endif %}

# KlipperScreen's load and unload buttons (active toolhead, the print
# temperature while a print is paused, also after the pause cooldown)
[gcode_macro LOAD_FILAMENT]
description: Load filament into the active toolhead (TOOL= TEMP= LENGTH= SPEED=)
gcode:
    {% set tool = params.TOOL|default(1 if printer.toolhead.extruder == 'extruder1' else 0)|int %}
    {% set target = printer['extruder1' if tool == 1 else 'extruder'].target %}
    {% if target < 170 and printer.pause_resume.is_paused %}
    {% set target = printer["gcode_macro _SNAPMAKER_STATE"].pause_temps[tool] %}
    {% endif %}
    SNAPMAKER_LOAD_FILAMENT TOOL={tool} TEMP={params.TEMP|default(target if target >= 170 else 220)} LENGTH={params.LENGTH|default(60)} SPEED={params.SPEED|default(600)}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active toolhead (TOOL= TEMP= LENGTH=)
gcode:
    {% set tool = params.TOOL|default(1 if printer.toolhead.extruder == 'extruder1' else 0)|int %}
    {% set target = printer['extruder1' if tool == 1 else 'extruder'].target %}
    {% if target < 170 and printer.pause_resume.is_paused %}
    {% set target = printer["gcode_macro _SNAPMAKER_STATE"].pause_temps[tool] %}
    {% endif %}
    SNAPMAKER_UNLOAD_FILAMENT TOOL={tool} TEMP={params.TEMP|default(target if target >= 170 else 220)} LENGTH={params.LENGTH|default(80)}

[gcode_macro _SNAPMAKER_FILAMENT_POSITION]
description: Move a nozzle off its parking wiper to load, unload or extrude (TOOL=)
gcode:
    # A parked nozzle presses the filament into its silicone wiper: as on
    # the stock firmware, purge just beside it, so the filament falls down
    # between the wiper and the bed, with the bed well below the nozzle.
    # In a paused print the active tool stays (RESUME restores the
    # carriages and the height).
    {% set tool = params.TOOL|int %}
    {% set paused = printer.pause_resume.is_paused %}
    {% if not paused %}
    SNAPMAKER_HOME_IF_NEEDED
    T{tool}
    {% elif printer.dual_carriage['carriage_%d' % tool] != 'PRIMARY' %}
    SET_DUAL_CARRIAGE CARRIAGE={tool}
    {% endif %}
    # A separate macro sees the state after homing and the tool change
    _SNAPMAKER_FILAMENT_MOVE TOOL={tool}

[gcode_macro _SNAPMAKER_FILAMENT_MOVE]
# Distance of the purge position from the endstop per tool (mm)
variable_offset: [11, 7]
gcode:
    {% set tool = params.TOOL|int %}
    {% set paused = printer.pause_resume.is_paused %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
    {% set home = printer.snapmaker_j1_probe.carriage_endstops[tool] %}
    {% set z = printer.toolhead.position.z %}
    {% set z_max = printer.toolhead.axis_maximum.z %}
    {% if paused %}
    # 12mm above the paused print instead of 2mm
    {% set z_min = printer["gcode_macro _SNAPMAKER_STATE"].pause_position[2] + 12 %}
    {% else %}
    {% set z_min = 50 %}
    {% endif %}
    SAVE_GCODE_STATE NAME=_snap_j1_filpos
    SET_GCODE_OFFSET X=0 Y=0
    G90
    {% if z < z_min %}
    G1 Z{[z_min, z_max]|min} F600
    {% endif %}
    {% set offset = printer["gcode_macro _SNAPMAKER_FILAMENT_MOVE"].offset[tool] %}
    G1 X{home - offset if tool == 1 else home + offset} F6000
    RESTORE_GCODE_STATE NAME=_snap_j1_filpos
    {% endif %}

[gcode_macro _SNAPMAKER_EXTRUDE]
gcode:
    # Move the filament of one toolhead only (TOOL= LENGTH= SPEED=), also
    # while the right extruder follows the left one for duplication
    {% set s = printer["gcode_macro _SNAPMAKER_STATE"] %}
    {% set extruder = 'extruder1' if params.TOOL|int == 1 else 'extruder' %}
    {% set active = printer.toolhead.extruder %}
    {% set synced = s.print_mode in ['DUPLICATION', 'MIRROR'] %}
    SAVE_GCODE_STATE NAME=_snap_j1_extrude
    {% if synced %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    {% endif %}
    {% if extruder != active %}
    ACTIVATE_EXTRUDER EXTRUDER={extruder}
    {% endif %}
    M83
    G1 E{params.LENGTH|float} F{params.SPEED|float}
    {% if extruder != active %}
    ACTIVATE_EXTRUDER EXTRUDER={active}
    {% endif %}
    {% if synced %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    {% endif %}
    RESTORE_GCODE_STATE NAME=_snap_j1_extrude

######################################################################
# Noise modes (normal, silent and loud)
######################################################################

[gcode_macro SNAPMAKER_NOISE_MODE]
description: Select the motion noise mode (NORMAL, SILENT, LOUD)
gcode:
    {% set mode = params.MODE|default('NORMAL')|upper %}
    # Stock limits per mode (normal X/Y 200 mm/s and 8000 mm/s^2, silent
    # X105 Y75 and 3000, loud 350 and 10000), within the printer limits
    # (300 mm/s, 8000 mm/s^2) as Klipper has one limit for X and Y
    {% set limits = {'NORMAL': [200, 8000, 0], 'SILENT': [75, 3000, 0], 'LOUD': [300, 8000, 1]} %}
    {% if mode not in limits %}
      { action_raise_error("Unknown noise mode %s" % mode) }
    {% endif %}
    {% set velocity, accel, spreadcycle = limits[mode] %}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=noise_mode VALUE='"{mode}"'
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=max_velocity VALUE={velocity}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=max_accel VALUE={accel}
    SET_VELOCITY_LIMIT VELOCITY={velocity} ACCEL={accel}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE={spreadcycle}
    SET_TMC_FIELD STEPPER=dual_carriage FIELD=en_spreadcycle VALUE={spreadcycle}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE={spreadcycle}

######################################################################
# Calibration
######################################################################

# The stock calibrations measure on the bare heated bed with hot, clean
# nozzles.  The steps below are used by the display's calibration menu
# (Snapmaker calibration panel) and by the SNAPMAKER_CALIBRATE_* macros.

[gcode_macro SNAPMAKER_CAL_BEGIN]
description: Prepare a calibration (full control mode, homed, left nozzle)
gcode:
    _SNAPMAKER_RESET_MODE
    SET_GCODE_OFFSET X=0 Y=0
    {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    T0
    SNAPMAKER_CAL_START

[gcode_macro SNAPMAKER_CAL_PRINT_PREPARE]
description: Prepare a calibration test print (full control mode, homed)
gcode:
    _SNAPMAKER_RESET_MODE
    SNAPMAKER_HOME_IF_NEEDED

[gcode_macro SNAPMAKER_HOME_IF_NEEDED]
description: Home all axes unless they are homed
gcode:
    # As the stock firmware at the start of a print; the calibration test
    # prints use it instead of their G28 lines
    {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
    {% endif %}

[gcode_macro SNAPMAKER_CAL_HEAT]
description: Heat both nozzles and the bed for calibration (WAIT=1 to wait)
gcode:
    M104.1 T0 S220
    M104.1 T1 S220
    M140 S60
    {% if params.WAIT|default(0)|int %}
    M109.1 T0 S220
    M109.1 T1 S220
    M190.1 S60
    {% endif %}

[gcode_macro SNAPMAKER_CAL_CLEAN_POSITION]
description: Move both nozzles 50mm out of their parking positions for cleaning
gcode:
    {% set x0 = printer.snapmaker_j1_probe.carriage_endstops[0] %}
    {% set x1 = printer.snapmaker_j1_probe.carriage_endstops[1] %}
    {% set active = 1 if printer.toolhead.extruder == 'extruder1' else 0 %}
    SAVE_GCODE_STATE NAME=_snapmaker_clean
    SET_GCODE_OFFSET X=0 Y=0
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{x0 + 50} F9000
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{x1 - 50} F9000
    SET_DUAL_CARRIAGE CARRIAGE={active}
    RESTORE_GCODE_STATE NAME=_snapmaker_clean

[gcode_macro SNAPMAKER_PID_PREPARE]
description: Move the nozzles off the parking wipers before a PID autotune (HEATER=)
gcode:
    # A parked nozzle touches its silicone wiper, which takes heat and
    # falsifies the measured heater behavior
    {% if params.HEATER|default('extruder') in ['extruder', 'extruder1'] %}
    _SNAPMAKER_RESET_MODE
    {% if 'x' not in printer.toolhead.homed_axes %}
    G28 X
    {% endif %}
    SNAPMAKER_CAL_CLEAN_POSITION
    M400
    {% endif %}

[gcode_macro SNAPMAKER_CAL_JOG]
description: Move the nozzle up or down during a manual calibration (DISTANCE=)
gcode:
    SAVE_GCODE_STATE NAME=_snapmaker_jog
    G91
    G1 Z{params.DISTANCE|float} F600
    RESTORE_GCODE_STATE NAME=_snapmaker_jog

[gcode_macro SNAPMAKER_CAL_END]
description: End a calibration, storing the results if SAVE=1
gcode:
    # Like the stock firmware: lower the bed, park both carriages and
    # the bed front, switch the heaters off
    {% set x0 = printer.snapmaker_j1_probe.carriage_endstops[0] %}
    {% set x1 = printer.snapmaker_j1_probe.carriage_endstops[1] %}
    SNAPMAKER_CAL_FINISH SAVE={params.SAVE|default(0)|int}
    {% if 'xyz' in printer.toolhead.homed_axes %}
    G90
    G1 Z{[100, printer.toolhead.axis_maximum.z]|min} F600
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{x1} F9000
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{x0} F9000
    G1 Y{printer.toolhead.axis_minimum.y} F9000
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    TURN_OFF_HEATERS

[gcode_macro SNAPMAKER_CALIBRATE_Z]
description: Calibrate the nozzle height on the bare bed (build plate removed)
gcode:
    SNAPMAKER_CAL_BEGIN
    SNAPMAKER_CAL_HEAT WAIT=1
    SNAPMAKER_CAL_DATUM POINT={params.POINT|default(1)|int}
    SNAPMAKER_CAL_END SAVE=1

[gcode_macro SNAPMAKER_CALIBRATE_XY]
description: Calibrate the XY offset of the right nozzle (build plate removed)
gcode:
    SNAPMAKER_CAL_BEGIN
    SNAPMAKER_CAL_HEAT WAIT=1
    SNAPMAKER_CAL_XY
    SNAPMAKER_CAL_END SAVE=1

[gcode_macro SNAPMAKER_BED_LEVEL]
description: Measure the front leveling wheels against the rear reference (build plate removed)
gcode:
    SNAPMAKER_CAL_BEGIN
    SNAPMAKER_CAL_HEAT WAIT=1
    SNAPMAKER_CAL_DATUM POINT=1
    SNAPMAKER_CAL_HEIGHT POINT=2 TOOL=0
    SNAPMAKER_CAL_HEIGHT POINT=3 TOOL=0
    SNAPMAKER_CAL_END SAVE=0

[gcode_macro SNAPMAKER_CALIBRATE_NOZZLE_HEIGHT]
description: Measure the right nozzle height against the left one (build plate removed)
gcode:
    SNAPMAKER_CAL_BEGIN
    SNAPMAKER_CAL_HEAT WAIT=1
    SNAPMAKER_CAL_DATUM POINT=3 ORIGIN=0
    SNAPMAKER_CAL_HEIGHT POINT=3 TOOL=1
    SNAPMAKER_CAL_END SAVE=0

[gcode_macro SNAPMAKER_SET_VIBRATION_FREQ]
description: Store the input shaper frequency picked from the vibration test print (AXIS=X|Y FREQ=)
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set freq = params.FREQ|float %}
    _SNAPMAKER_SET_SHAPER SHAPER_FREQ_{axis}={freq}
    SAVE_VARIABLE VARIABLE=snap_j1_shaper_freq_{axis|lower} VALUE={freq}

######################################################################
# Power loss recovery
######################################################################

[gcode_macro _SNAPMAKER_POWER_LOSS_RESTORE]
gcode:
    # Called by SNAPMAKER_POWER_LOSS_RESUME before the print continues at
    # the stored file position
    {% set bed = params.BED|default(0)|float %}
    {% set t0 = params.T0|default(0)|float %}
    {% set t1 = params.T1|default(0)|float %}
    {% set z = params.Z|float %}
    M140 S{bed}
    {% if t0 > 0 %}
    M104.1 T0 S{t0}
    {% endif %}
    {% if t1 > 0 %}
    M104.1 T1 S{t1}
    {% endif %}
    M190.1 S{bed}
    G28
    SNAPMAKER_SET_PRINT_MODE MODE={params.MODE|default('FULL_CONTROL')}
    SET_GCODE_VARIABLE MACRO=_SNAPMAKER_STATE VARIABLE=backup_swapped VALUE={params.SWAPPED|default(0)|int == 1}
    {% if params.MODE|default('FULL_CONTROL') not in ['DUPLICATION', 'MIRROR'] %}
    ACTIVATE_EXTRUDER EXTRUDER={params.EXTRUDER|default('extruder')}
    SET_DUAL_CARRIAGE CARRIAGE={1 if params.EXTRUDER|default('extruder') == 'extruder1' else 0}
    {% endif %}
    _SNAPMAKER_PRIME_ACTIVE
    M400
    _SNAPMAKER_CHECK_FILAMENT
    SET_GCODE_OFFSET X={params.OFFSET_X|default(0)} Y={params.OFFSET_Y|default(0)} Z={params.OFFSET_Z|default(0)}
    G90
    G1 Z{z + 2} F600
    G1 X{params.X} Y{params.Y} F9000
    G1 Z{z} F600
    {% if params.ABS_E|default(1)|int %}
    M82
    {% else %}
    M83
    {% endif %}
    G92 E{params.E|default(0)}
    G1 F{params.SPEED|default(50)|float * 60}
    M220 S{params.SPEED_FACTOR|default(1)|float * 100}
    M221 S{params.EXTRUDE_FACTOR|default(1)|float * 100}
    SET_FAN_SPEED FAN=left_part_fan SPEED={params.FAN0|default(0)}
    SET_FAN_SPEED FAN=right_part_fan SPEED={params.FAN1|default(0)}
