# KlipperScreen menu for the Snapmaker J1
#
# Included from KlipperScreen.conf by install.sh, so
# that it follows updates of this repository.

# Match the stock J1 screen saver delay: 15 minutes without touch,
# both while idle and while printing.
[main]
screen_blanking: 900
screen_blanking_printing: 900

# The material presets of the temperature panel heat both nozzles
# (KlipperScreen's presets only name the first extruder; presets defined
# here replace them, so all values are given, as KlipperScreen's)
[preheat PLA]
bed = 60
extruder = 195
extruder1 = 195

[preheat ABS]
bed = 90
extruder = 220
extruder1 = 220

[preheat PETG]
bed = 80
extruder = 240
extruder1 = 240

[preheat FLEX]
bed = 60
extruder = 210
extruder1 = 210

# The J1 calibration menu replaces the generic calibration panels
[menu __main snapmaker_calibration]
name: {{ gettext('Calibration') }}
icon: bed-level
panel: snapmaker_calibration

# Bed screws, Z offset and input shaper are calibrated in the J1 menu (the
# J1 has no accelerometer; vibration compensation uses a test print)
# Network: the WLAN connection and the name of the printer in the network
# (<name>.local) in one menu
[menu __main more network]
enable: False

[menu __main more snapmaker_network]
name: {{ gettext('Network') }}
icon: network

[menu __main more snapmaker_network wlan]
name: {{ gettext('WLAN') }}
icon: wifi_excellent
panel: network

[menu __main more snapmaker_network snapmaker_hostname]
name: {{ gettext('Network Name') }}
icon: hashtag
panel: snapmaker_hostname

# Time zone (the time itself comes from the network) and the clock in the
# title bar on or off
[menu __main more snapmaker_datetime]
name: {{ gettext('Clock') }}
icon: clock
panel: snapmaker_datetime

# Bed standby temperature and cooldown delay of a paused print
[menu __main more snapmaker_pause]
name: {{ gettext('Pause Standby') }}
icon: heat-up
panel: snapmaker_pause

# Case light and display settings, in place of the generic pins panel (the
# case light is the only output pin the J1 shows)
[menu __main more snapmaker_light]
name: {{ gettext('Light') }}
icon: light
panel: snapmaker_light

[menu __print snapmaker_light]
name: {{ gettext('Light') }}
icon: light
panel: snapmaker_light

[menu __main more pins]
enable: False

[menu __print pins]
enable: False

# Calibrations and PID_CALIBRATE store their results without SAVE_CONFIG
[menu __main more save]
enable: False

[menu __main more bedlevel]
enable: False

[menu __main more bedmesh]
enable: False

[menu __main more zoffset]
enable: False

[menu __main more input_shaper]
enable: False
