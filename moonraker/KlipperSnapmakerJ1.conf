# Moonraker update manager entry for KlipperSnapmakerJ1
#
# Included from moonraker.conf by install.sh.  Updates of this repository
# show up in the update panel of KlipperScreen, Mainsail and Fluidd.
# Moonraker restarts Klipper and itself afterwards (it may only manage
# klipper, moonraker or a service of the entry's own name), so changes of
# the KlipperScreen add-on take effect when KlipperScreen restarts next.
# The version comes from the release tags (vX.Y.Z) of this repository.

[update_manager KlipperSnapmakerJ1]
type: git_repo
channel: dev
path: ~/KlipperSnapmakerJ1
origin: https://github.com/Nimrasol/KlipperSnapmakerJ1.git
primary_branch: main
managed_services: klipper moonraker
info_tags:
    desc=Snapmaker J1 support for Klipper

# Klipper, Moonraker and KlipperScreen are offered as updates only up to
# the versions this release is tested with (versions.conf).  A release
# with newer tested versions moves the pins: update KlipperSnapmakerJ1
# first, then the others.  The options are added to the entries of these
# programs (KlipperScreen's own entry is in moonraker.conf).
# --- pinned versions (scripts/snapmaker_j1_versions.py) ---

# klipper v0.13.0-816-gee2c6fb6
[update_manager klipper]
pinned_commit: ee2c6fb6b00b2b5d097ef70d0868df7d74943b51

# moonraker v0.11.0-4-gb559b9a
[update_manager moonraker]
pinned_commit: b559b9a81161f958a43c2f527b6ad96f73310d5d

# KlipperScreen v0.4.7-198-g911c75b
[update_manager KlipperScreen]
pinned_commit: 911c75bfc7658c0f5db39b39ee35910082e807f4

# --- end of pinned versions ---
