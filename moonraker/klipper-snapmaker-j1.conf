# Moonraker update manager entry for klipper-snapmaker-j1
#
# Included from moonraker.conf by install.sh.  Updates of this repository
# show up in the update panel of KlipperScreen, Mainsail and Fluidd;
# Klipper and KlipperScreen are restarted afterwards.

[update_manager klipper-snapmaker-j1]
type: git_repo
channel: dev
path: ~/klipper-snapmaker-j1
origin: https://github.com/Nimrasol/klipper-snapmaker-j1.git
primary_branch: main
managed_services: klipper KlipperScreen
info_tags:
    desc=Snapmaker J1 support for Klipper
